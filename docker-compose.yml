services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      uagl_network:
        aliases:
          - database
    environment:
      POSTGRES_DB: ${DB_DATABASE:-uagl_db}
      POSTGRES_USER: ${DB_USERNAME:-uagl_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-user_password_123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-uagl_user} -d ${DB_DATABASE:-uagl_db}"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build:
      context: ./Server
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - uagl_network
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-uagl_db}
      DB_USERNAME: ${DB_USERNAME:-uagl_user}
      DB_PASSWORD: ${DB_PASSWORD:-user_password_123}
    volumes:
      - ./Server:/app
      - server_vendor:/app/vendor
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./Client
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - uagl_network
    environment:
      VITE_API_URL: http://localhost:8000/api
    volumes:
      - ./Client:/app
      - client_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - server
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  postgres_data:
  server_vendor:
  client_node_modules:

networks:
  uagl_network:
    driver: bridge
