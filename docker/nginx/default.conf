server {
    listen 80;
    server_name localhost;
    root /var/www/public;
    index index.php index.html;

    # Docker DNS resolver (so upstream IP changes are picked up after container restarts)
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Frontend Vue.js
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Fichiers statiques frontend
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri @backend;
    }

    location @backend {
        root /var/www/public;
        try_files $uri /index.php?$query_string;
    }

    # API et routes Laravel
    location /api {
        root /var/www/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP
    location ~ \.php$ {
        root /var/www/public;
        set $php_upstream laravel:9000;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
        include fastcgi_params;
        # Bearer Sanctum : doit être après fastcgi_params pour ne pas être écrasé
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    }
}